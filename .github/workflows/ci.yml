name: CI/CD

# One run per commit (push only; a PR shows the run of its head commit).
#   verify   Biome, types, architecture tests, import boundaries, dead code and the
#            Vite build on the GCP runners (self-hosted, meritum);
#            a newer push to the same branch cancels it, never on main/develop.
#   deploy   develop -> https://meritum-dev.gburek.app, main -> https://meritum.gburek.app,
#            on dellpromaxgb10 after verify; never cancelled mid-way, one at a time.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, meritum]
    timeout-minutes: 15
    concurrency:
      group: ci-verify-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # pnpm from npm (version from packageManager); the store stays on the runner.
      - run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm biome ci --reporter=github --error-on-warnings .
      - run: pnpm test # tests/architecture (JSDoc @feature, constants, 250 lines), sums of the pnpm sync copies
      - run: pnpm depcruise # import boundaries (.dependency-cruiser.cjs)
      - run: pnpm knip # dead code and unused dependencies
      - run: pnpm build # tsc -b (strict) + vite build

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: [self-hosted, dellpromaxgb10]
    timeout-minutes: 20
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy
        run: deploy/deploy.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Public check
        run: |
          url=${{ github.ref_name == 'main' && 'https://meritum.gburek.app' || 'https://meritum-dev.gburek.app' }}
          for _ in $(seq 20); do
            if curl -fsS "$url/" | grep -q '<div id="root">'; then echo "OK: $url"; exit 0; fi
            sleep 5
          done
          # Routes come from the platform workflow (needs CLOUDFLARE_API_TOKEN).
          echo "::warning title=Public check::$url does not serve the app yet"
